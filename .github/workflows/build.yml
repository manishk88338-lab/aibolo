name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/aibolo
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AIBolo"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.aibolo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.aibolo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/java/com/example/aibolo/MainActivity.kt <<'EOF'
          package com.example.aibolo

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.SearchManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.telephony.SmsManager
          import android.text.InputType
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          const val MODEL = "claude-haiku-5-5"

          const val SYSTEM = """तुम एक Android फ़ोन वॉइस असिस्टेंट हो। यूज़र की भाषा में बोलो। हमेशा सिर्फ़ एक JSON लौटाओ, और कुछ नहीं:
          {"speech":"छोटा बोलचाल वाला जवाब, बिना markdown के","actions":[{"type":"..."}]}
          type के विकल्प:
          call {name या number}; sms {name या number, text}; alarm {hour(0-23), minute, label}; timer {seconds};
          torch {on: true/false}; open_app {name}; open_url {url}; web_search {query};
          volume {direction: up/down/mute}; music {query}; wifi_panel; bluetooth_panel.
          कोई काम न हो तो actions खाली [] रखो। कॉन्टैक्ट का नाम जैसा यूज़र ने बोला वैसा ही दो।"""

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private lateinit var logView: TextView
              private lateinit var scroll: ScrollView
              private lateinit var keyBox: EditText
              private val history = JSONArray()
              private var torchOn = false
              private var busy = false

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  tts = TextToSpeech(this, this)
                  val prefs = getSharedPreferences("p", 0)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 90, 32, 32) }
                  keyBox = EditText(this).apply {
                      hint = "Claude API key (sk-ant-...)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(prefs.getString("key", ""))
                  }
                  val save = Button(this).apply {
                      text = "चाबी सेव करें"
                      setOnClickListener {
                          prefs.edit().putString("key", keyBox.text.toString().trim()).apply()
                          say("चाबी सेव हो गई")
                      }
                  }
                  logView = TextView(this).apply { textSize = 17f }
                  scroll = ScrollView(this).apply { addView(logView) }
                  val mic = Button(this).apply { text = "🎤 बोलिए"; textSize = 22f; setOnClickListener { listen() } }
                  val input = EditText(this).apply { hint = "या यहाँ लिखिए" }
                  val send = Button(this).apply {
                      text = "भेजें"
                      setOnClickListener { val t = input.text.toString(); input.setText(""); handle(t) }
                  }
                  root.addView(keyBox); root.addView(save)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(mic); root.addView(input); root.addView(send)
                  setContentView(root)
                  requestPermissions(arrayOf(
                      Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS, Manifest.permission.READ_CONTACTS), 1)
              }

              override fun onInit(s: Int) { tts.language = Locale("hi", "IN") }
              override fun onDestroy() { tts.shutdown(); super.onDestroy() }

              private fun has(p: String) = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED
              private fun log(s: String) { logView.append(s + "\n\n"); scroll.post { scroll.fullScroll(ScrollView.FOCUS_DOWN) } }
              private fun say(t: String) { log("🤖 $t"); tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u") }

              private fun listen() {
                  if (!has(Manifest.permission.RECORD_AUDIO)) { say("माइक की अनुमति दीजिए"); return }
                  tts.stop()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(res: Bundle?) {
                          res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.let { handle(it) }
                          r.destroy()
                      }
                      override fun onError(e: Int) { log("⚠️ सुन नहीं पाया (कोड $e)"); r.destroy() }
                      override fun onReadyForSpeech(p: Bundle?) { log("🎧 सुन रहा हूँ…") }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  r.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN"))
              }

              private fun handle(q: String) {
                  if (q.isBlank() || busy) return
                  val key = getSharedPreferences("p", 0).getString("key", "") ?: ""
                  if (key.isEmpty()) { say("पहले ऊपर API चाबी डालकर सेव कीजिए"); return }
                  busy = true
                  log("🧑 $q")
                  history.put(JSONObject().put("role", "user").put("content", q))
                  Thread {
                      val out = try { askClaude(key) } catch (e: Exception) {
                          """{"speech":"नेटवर्क या API चाबी में गड़बड़ है","actions":[]}"""
                      }
                      runOnUiThread { busy = false; process(out) }
                  }.start()
              }

              private fun askClaude(key: String): String {
                  var start = maxOf(0, history.length() - 10)
                  while (start < history.length() && history.getJSONObject(start).getString("role") == "assistant") start++
                  val msgs = JSONArray()
                  for (i in start until history.length()) msgs.put(history.get(i))
                  val body = JSONObject().put("model", MODEL).put("max_tokens", 600)
                      .put("system", SYSTEM).put("messages", msgs)
                  val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"; c.doOutput = true
                  c.connectTimeout = 15000; c.readTimeout = 60000
                  c.setRequestProperty("x-api-key", key)
                  c.setRequestProperty("anthropic-version", "2023-06-01")
                  c.setRequestProperty("content-type", "application/json")
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val s = (if (c.responseCode < 400) c.inputStream else c.errorStream).bufferedReader().readText()
                  val text = JSONObject(s).getJSONArray("content").getJSONObject(0).getString("text")
                  history.put(JSONObject().put("role", "assistant").put("content", text))
                  return text
              }

              private fun process(raw: String) {
                  var speech = raw
                  var actions = JSONArray()
                  try {
                      val j = JSONObject(raw.substring(raw.indexOf('{'), raw.lastIndexOf('}') + 1))
                      speech = j.optString("speech", "")
                      actions = j.optJSONArray("actions") ?: JSONArray()
                  } catch (e: Exception) {}
                  if (speech.isNotEmpty()) say(speech)
                  for (i in 0 until actions.length()) {
                      try { act(actions.getJSONObject(i)) } catch (e: Exception) { log("⚠️ काम नहीं हो पाया: ${e.message}") }
                  }
              }

              private fun find(name: String): String? {
                  if (name.isBlank() || !has(Manifest.permission.READ_CONTACTS)) return null
                  val ph = ContactsContract.CommonDataKinds.Phone
                  contentResolver.query(ph.CONTENT_URI, arrayOf(ph.NUMBER), "${ph.DISPLAY_NAME} LIKE ?", arrayOf("%$name%"), null)
                      ?.use { if (it.moveToFirst()) return it.getString(0) }
                  return null
              }

              @Suppress("DEPRECATION")
              private fun act(a: JSONObject) {
                  when (a.optString("type")) {
                      "call" -> {
                          val n: String? = a.optString("number").ifEmpty { find(a.optString("name")) }
                          if (n.isNullOrEmpty()) { say("नंबर नहीं मिला"); return }
                          val act = if (has(Manifest.permission.CALL_PHONE)) Intent.ACTION_CALL else Intent.ACTION_DIAL
                          startActivity(Intent(act, Uri.parse("tel:$n")))
                      }
                      "sms" -> {
                          val n: String? = a.optString("number").ifEmpty { find(a.optString("name")) }
                          val t = a.optString("text")
                          if (n.isNullOrEmpty()) { say("नंबर नहीं मिला"); return }
                          AlertDialog.Builder(this).setMessage("$n को भेजूँ?\n$t")
                              .setPositiveButton("हाँ") { _, _ ->
                                  SmsManager.getDefault().sendTextMessage(n, null, t, null, null)
                                  say("मैसेज भेज दिया")
                              }.setNegativeButton("नहीं", null).show()
                      }
                      "alarm" -> startActivity(Intent(AlarmClock.ACTION_SET_ALARM)
                          .putExtra(AlarmClock.EXTRA_HOUR, a.getInt("hour"))
                          .putExtra(AlarmClock.EXTRA_MINUTES, a.optInt("minute"))
                          .putExtra(AlarmClock.EXTRA_MESSAGE, a.optString("label"))
                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true))
                      "timer" -> startActivity(Intent(AlarmClock.ACTION_SET_TIMER)
                          .putExtra(AlarmClock.EXTRA_LENGTH, a.getInt("seconds"))
                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true))
                      "torch" -> {
                          val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          torchOn = a.optBoolean("on", !torchOn)
                          cm.setTorchMode(cm.cameraIdList[0], torchOn)
                      }
                      "open_app" -> {
                          val n = a.optString("name").lowercase()
                          val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                          val hit = packageManager.queryIntentActivities(i, 0)
                              .firstOrNull { it.loadLabel(packageManager).toString().lowercase().contains(n) }
                          if (hit == null) say("ऐप नहीं मिला")
                          else startActivity(packageManager.getLaunchIntentForPackage(hit.activityInfo.packageName)!!)
                      }
                      "open_url" -> startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(a.getString("url"))))
                      "web_search" -> startActivity(Intent(Intent.ACTION_WEB_SEARCH).putExtra(SearchManager.QUERY, a.optString("query")))
                      "volume" -> {
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val d = when (a.optString("direction")) {
                              "up" -> AudioManager.ADJUST_RAISE
                              "down" -> AudioManager.ADJUST_LOWER
                              else -> AudioManager.ADJUST_MUTE
                          }
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, AudioManager.FLAG_SHOW_UI)
                      }
                      "music" -> startActivity(Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH)
                          .putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*")
                          .putExtra(SearchManager.QUERY, a.optString("query")))
                      "wifi_panel" -> startActivity(Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY))
                      "bluetooth_panel" -> startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                  }
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Bolo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
